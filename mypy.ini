[mypy]
# Exclude test-fixture trees and conftest stubs that intentionally mirror
# the project's real test layout. Without these excludes, mypy raises
# "Duplicate module named 'conftest'" because fixture files and the
# project's own conftest.py all resolve to top-level module "conftest"
# (none of the parents carry an __init__.py so mypy cannot distinguish
# them as packages).
#
# Also exclude the thin root-level harness_cli.py wrapper, which is an
# auto-generated delegate to harness/harness_cli.py and shares its module
# name with the real CLI under harness/ (no __init__.py on either parent
# directory to disambiguate them as packages).
#
# Rationale per excluded path:
#   build/                       – Python setup.py build artifacts (already
#                                 in .gitignore; nothing here is real source)
#   harness/tests/fixtures/      – harness test fixtures that mimic project
#                                 layouts (submodule-owned per HR-17)
#   03-development/tests/conftest.py
#                               – pytest bootstrap script; not type-checked
#                                 payload, only registers fixtures + sys.path.
#                                 Excluding it removes the duplicate-module
#                                 conflict with harness/conftest.py without
#                                 breaking pytest collection.
#   harness_cli.py               – auto-generated root wrapper that delegates
#                                 to harness/harness_cli.py; thin subprocess
#                                 wrapper without any project-specific logic.
#   .venv/, venv/                – third-party packages
#   .mutmut-cache/, .code-review-graph/, .sessi-work/
#                               – tooling state directories
exclude = (?x)^(build/|harness/tests/fixtures/|03-development/tests/conftest\.py|^harness_cli\.py|\.venv/|venv/|\.mutmut-cache/|\.code-review-graph/|\.sessi-work/)