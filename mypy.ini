# mypy.ini — Project-level mypy configuration.
# Excludes the harness/ submodule from checks: it is a vendored copy
# (git submodule) and contains its own test fixtures whose conftest.py
# modules collide on the mypy module graph when checked from the repo
# root. The harness's own pyproject.toml/mypy.ini applies inside that
# directory; we do not re-lint it from here.
[mypy]
exclude = (?x)(^harness/
            |^03-development/tests/integration/
            |^conftest\.py$
            |^tests/
            |^03-development/tests/[^/]+$)