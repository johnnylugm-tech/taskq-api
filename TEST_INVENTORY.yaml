      - test_fr04_403_body_does_not_reveal_resource_existence  # FR-04 ↔ NFR-02 (AC-02.4)
      - test_fr10_error_body_contains_no_stack_or_sql_or_path  # FR-10 ↔ NFR-02 (AC-02.5)
      - test_403_body_does_not_leak_resource_existence # NFR-02 ↔ FR-04 (AC-4.2)
      - test_500_body_contains_no_stack_or_sql_or_path # NFR-02 ↔ FR-10 (AC-10.3)
