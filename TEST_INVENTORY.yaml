# TEST_INVENTORY.yaml — P1 Naming Authority + 1:1 TC Enumeration (FR×AC)
# SSOT for test function names that derive_test_cases.md preserves in TEST_SPEC.md.
# Each tc_id is a SEPARATE contract item derived from one FR/NFR acceptance criterion
# (canonical SPEC §8 #1..#27 and SRS §3/§4 inline ACs).
# Range shorthand TC-XX-NNa..g MUST be expanded into independent entries below.
# Cross-cutting coverage is signalled via metadata (cross_ref_frs / cross_ref_nfrs);
# deletion of a §2 matrix FR/NFR row in favour of another is PROHIBITED.
format_version: "2.0"

