# TEST_INVENTORY.yaml — P1 Naming Authority (per-FR test function names from TRACEABILITY_MATRIX.md §3/§4)
# This file is the AUTHORITATIVE test name registry for Phase 1.
# TEST_SPEC.md (P2) is generated FROM this file by derive_test_cases.md; on conflict, this file wins.
# Naming convention: pytest `test_frNN_xxx` (functional) / `test_<verb>_<subject>` (cross-cutting NFR).
# Layer vocabulary matches the matrix's `Verification` column (unit / integration / benchmark /
# grep_gate / ast_scan / static_scan / config_assertion / artifact_assertion / suite_assertion /
# scan / lint_imports / matrix_assertion / tool_gate / radon / tool_config).
# Every tc_id below resolves to a single row in TRACEABILITY_MATRIX.md §3 or §4 forward trace.
format_version: "1.1"

test_inventory:
  metadata:
    phase: P1
    language: python
    test_runner: pytest
    matrix_source: 01-requirements/TRACEABILITY_MATRIX.md
    spec_source: SPEC.md
    naming_convention:
      functional: "test_frNN_<verb>_<subject>"     # NN = 2-digit FR id (01..10)
      cross_cutting_nfr: "test_<verb>_<subject>"   # NFR tests, no frNN prefix
      auth_scope_403: "test_403_body_*"            # §4.2 / §5.1 cross-ref to FR-04
      error_body_500: "test_500_body_*"            # §4.2 / §5.1 cross-ref to FR-10
    unique_test_count: 85                          # 89 enumerated rows in matrix − 4 cross-referenced duplicates
    matrix_row_count: 89                           # verbatim count of named test rows in §3/§4 forward trace
    matrix_section2_count: 89                      # §2 "Tests" column total = 89 (sum of per-FR counts)
    enumerated_count: 85                           # tc_ids in `tests:` block (1:1 with unique matrix test names)
    duplicate_cross_cuts_excluded:
      - test_fr03_key_compare_is_constant_time      # also named in §4.2 (NFR-02 AC-02.3); primary owner FR-03
      - test_fr03_key_create_prints_plaintext_once  # also named in §4.4 (NFR-04 AC-04.3); primary owner FR-03
      - test_fr06_transaction_commits_on_success_rolls_back_on_error  # also in §4.3 (NFR-03 AC-03.1); primary FR-06
      - test_fr08_timeout_kills_child_leaving_no_orphan  # also in §4.3 (NFR-03 AC-03.5); primary FR-08

  # ---------------------------------------------------------------------------
  # Forward trace — every tc_id below corresponds to a named test in matrix §3/§4.
