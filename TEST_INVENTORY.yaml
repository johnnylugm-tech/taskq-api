  # ---------------------------------------------------------------------------
  # Naming-convention audit — every test_name above matches one of these
  # regexes. derive_test_cases.md MUST reject any test that fails the audit.
  # ---------------------------------------------------------------------------
  naming_convention_audit:
    fr_pattern: '^test_fr\d{2}_[a-z0-9_]+$'              # FR-01..FR-10 (2-digit id)
    nfr_pattern: '^test_[a-z][a-z0-9_]+$'                # NFR / cross-cutting (no frNN prefix)
    forbidden_patterns:
      - '^test_fr\d{2}_'                                 # applies to NFR tests, not to FR tests
      - '^test_TC_'                                      # no TC-prefixed names
      - '__'                                             # no double-underscore
