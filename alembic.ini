# [FR-07] Alembic configuration for the three-step evolution
# (v1_initial / v2_tags / v3_split_results).
#
# Citations:
# - SPEC.md §3 FR-07 — three revisions, each with a working
#   ``downgrade()`` (no destructive shortcut).
# - SAD.md §3.3 — alembic discovers revisions via
#   ``03-development/src/migrations/versions/``.
#
# The CLI is driven by ``python3 -m alembic <command>`` from the
# project root with ``TASKQ_DB_URL`` and ``PYTHONPATH`` set in the
# subprocess environment. ``script_location`` points at the
# ``migrations`` package under ``03-development/src/`` so the
# ``versions/v1_initial`` / ``v2_tags`` / ``v3_split_results`` modules
# are importable when alembic bootstraps the revision registry.

[alembic]
script_location = 03-development/src/migrations
prepend_sys_path = 03-development/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# The ``sqlalchemy.url`` is intentionally empty — ``env.py`` reads
# ``TASKQ_DB_URL`` from the environment so the same alembic invocation
# can target any DB (test, staging, prod) without an .ini change.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
