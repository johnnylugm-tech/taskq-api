[alembic]
# Alembic configuration for FR-07. [FR-07]
# Citations: SPEC.md §3 FR-07; SAD.md §2.3.10.
script_location = 03-development/src/migrations
prepend_sys_path = 03-development/src,.

# DATABASE_URL is supplied by ``migrations.env`` from the
# ``TASKQ_DATABASE_URL`` environment variable so the same alembic.ini is
# reusable across dev, test, and CI without per-environment edits.
# sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
